<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 응원</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --bg: #ffffff; --fg: #37352f; --sub: #9b9a97; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #191919; --fg: #e6e6e5; --sub: #7f7f7c; }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    padding: 16px; box-sizing: border-box; text-align: center;
  }
  #quote {
    color: var(--fg); font-size: clamp(17px, 4.5vw, 24px); font-weight: 500;
    line-height: 1.6; letter-spacing: -0.01em; word-break: keep-all;
    max-width: 640px; opacity: 0; transition: opacity .8s ease;
  }
  #quote.show { opacity: 1; }
</style>
</head>
<body>
<p id="quote"></p>
<script>
  const quotes = [
    "오늘도 충분히 잘 해냈어. 결과와 상관없이 너의 하루는 의미 있었어.",
    "서류 한 장이 너의 가치를 결정하지 않아.",
    "느려도 괜찮아. 멈추지 않고 있다는 게 중요해.",
    "불합격은 거절이 아니라 아직 맞는 자리를 못 만난 것뿐이야.",
    "지금 쌓고 있는 시간은 절대 사라지지 않아.",
    "남과 비교하지 마. 너는 너만의 속도로 가고 있어.",
    "오늘 하루 버틴 것만으로도 대단한 일이야.",
    "지쳤다면 쉬어도 돼. 쉬는 것도 준비의 일부야.",
    "네가 여기까지 온 길을 기억해. 그건 우연이 아니었어.",
    "모든 문은 결국 하나만 열리면 돼.",
    "너를 알아봐 줄 곳은 반드시 있어.",
    "불안한 건 그만큼 진심이라는 뜻이야.",
    "작은 한 걸음도 앞으로 가는 거야.",
    "오늘의 노력은 내일의 너에게 보내는 선물이야.",
    "넘어져도 괜찮아. 다시 일어나는 법을 넌 이미 알고 있어.",
    "지금 이 시기도 언젠가 웃으며 이야기할 날이 올 거야.",
    "너는 생각보다 훨씬 강한 사람이야.",
    "완벽하지 않아도 돼. 진짜 너면 충분해.",
    "기다림이 길수록 더 잘 맞는 자리가 오고 있는 거야.",
    "스스로에게 조금 더 다정해져도 괜찮아.",
    "결과는 아직 오지 않았을 뿐, 오고 있는 중이야.",
    "하루하루 쌓인 너의 경험이 결국 너의 무기가 될 거야.",
    "힘들다고 느끼는 건 포기하지 않았다는 증거야.",
    "오늘은 어제보다 조금 더 가까워졌어.",
    "너의 가능성은 아직 다 드러나지 않았어.",
    "잠깐 흔들려도 괜찮아. 뿌리는 그대로야.",
    "누군가는 지금의 너를 보며 용기를 얻고 있을지도 몰라.",
    "끝까지 해보는 사람이 결국 원하는 곳에 닿아.",
    "오늘 할 수 있는 만큼만 하자. 그걸로 충분해.",
    "너는 이미 많은 걸 이겨내 왔어. 이번에도 그럴 거야."
  ];
  const now = new Date();
  const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  const start = Date.UTC(2026, 0, 1);
  const days = Math.floor((today - start) / 86400000);
  const idx = ((days % quotes.length) + quotes.length) % quotes.length;
  const el = document.getElementById("quote");
  el.textContent = quotes[idx];
  requestAnimationFrame(() => el.classList.add("show"));
</script>
</body>
</html>
